server.port=${PORT:8080}
spring.application.name=inventory-billing

# ---- MySQL (database is created automatically) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/inventory_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:YourPassword}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.datasource.hikari.maximum-pool-size=${DB_POOL:5}

# ---- JWT ----
app.jwt.secret=${JWT_SECRET:c2hvcC1pbnZlbnRvcnktYmlsbGluZy1zZWNyZXQta2V5LWNoYW5nZS1tZS0xMjM0NTY3ODkw}
app.jwt.expiration-ms=86400000

# ---- CORS (React dev server) ----
app.cors.origins=${CORS_ORIGINS:http://localhost:5173}

# ---- Shop details (printed on invoice PDF) ----
app.shop.name=${SHOP_NAME:Sri Murugan Stores}
app.shop.address=${SHOP_ADDRESS:12, Main Road, Chennai - 600001}
app.shop.phone=${SHOP_PHONE:+91 98765 43210}
app.shop.gstin=${SHOP_GSTIN:33ABCDE1234F1Z5}

# ---- Low stock alert (scheduled job, default: every day 9 AM) ----
app.low-stock.enabled=false
app.low-stock.to=owner@example.com
app.low-stock.cron=0 0 9 * * *

# ---- Mail (only needed if app.low-stock.enabled=true). Gmail example, use an App Password ----
#spring.mail.host=smtp.gmail.com
#spring.mail.port=587
#spring.mail.username=your@gmail.com
#spring.mail.password=your-app-password
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.properties.mail.smtp.starttls.enable=true

# ---- First-run data ----
# In production set SEED_SAMPLE_DATA=false (no demo products, no demo staff login) and ADMIN_PASSWORD to a strong password.
app.seed-sample-data=${SEED_SAMPLE_DATA:true}
app.admin.password=${ADMIN_PASSWORD:admin123}
